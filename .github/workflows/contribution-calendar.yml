name: Update GitHub Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub graphics
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const fs = require("fs");

            const username = "Viyan-Dabre";

            /*
             * ------------------------------------------------------------
             * Contribution time range
             * ------------------------------------------------------------
             *
             * Explicitly request the last year instead of relying on the
             * API's default contribution collection range.
             */

            const now = new Date();
            const oneYearAgo = new Date(now);

            oneYearAgo.setUTCFullYear(oneYearAgo.getUTCFullYear() - 1);

            const from = oneYearAgo.toISOString();
            const to = now.toISOString();

            console.log(`Contribution range: ${from} -> ${to}`);

            /*
             * ------------------------------------------------------------
             * GitHub GraphQL query
             * ------------------------------------------------------------
             */

            const query = `
              query(
                $login: String!
                $from: DateTime!
                $to: DateTime!
              ) {
                user(login: $login) {
                  contributionsCollection(
                    from: $from
                    to: $to
                  ) {
                    startedAt
                    endedAt

                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalRepositoriesWithContributedCommits
                    totalRepositoryContributions

                    hasAnyContributions
                    hasAnyRestrictedContributions
                    restrictedContributionsCount
                    earliestRestrictedContributionDate
                    latestRestrictedContributionDate

                    contributionCalendar {
                      totalContributions

                      weeks {
                        contributionDays {
                          contributionCount
                          date
                          contributionLevel
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username,
              from,
              to
            });

            const user = result.user;
            const c = user.contributionsCollection;

            const calendar = c.contributionCalendar;
            const weeks = calendar.weeks;

            /*
             * ------------------------------------------------------------
             * Flatten contribution days
             * ------------------------------------------------------------
             */

            const days = weeks
              .flatMap(week => week.contributionDays)
              .sort((a, b) => a.date.localeCompare(b.date));

            /*
             * ------------------------------------------------------------
             * Main statistics
             * ------------------------------------------------------------
             */

            const total = calendar.totalContributions;

            const commits = c.totalCommitContributions;

            const pullRequests =
              c.totalPullRequestContributions;

            const issues =
              c.totalIssueContributions;

            const repositories =
              c.totalRepositoriesWithContributedCommits;

            /*
             * ------------------------------------------------------------
             * Diagnostic information
             * ------------------------------------------------------------
             */

            console.log("");
            console.log("========== GitHub Contribution Diagnostics ==========");

            console.log(`Username: ${username}`);

            console.log(`Collection started: ${c.startedAt}`);

            console.log(`Collection ended: ${c.endedAt}`);

            console.log(`Total contributions: ${total}`);

            console.log(`Commits: ${commits}`);

            console.log(`Pull requests: ${pullRequests}`);

            console.log(`Issues: ${issues}`);

            console.log(`Repositories with commits: ${repositories}`);

            console.log(
              `Repositories created: ${c.totalRepositoryContributions}`
            );

            console.log(
              `Has any contributions: ${c.hasAnyContributions}`
            );

            console.log(
              `Has restricted contributions: ${c.hasAnyRestrictedContributions}`
            );

            console.log(
              `Restricted contributions count: ${c.restrictedContributionsCount}`
            );

            console.log(
              `Earliest restricted contribution: ${c.earliestRestrictedContributionDate || "none"}`
            );

            console.log(
              `Latest restricted contribution: ${c.latestRestrictedContributionDate || "none"}`
            );

            console.log("====================================================");
            console.log("");

            /*
             * ------------------------------------------------------------
             * Current date
             * ------------------------------------------------------------
             *
             * Use UTC because GitHub's contribution calendar dates are
             * represented as calendar dates.
             */

            const today =
              new Date().toISOString().slice(0, 10);

            /*
             * ------------------------------------------------------------
             * Longest streak
             * ------------------------------------------------------------
             */

            let longest = 0;
            let longestStart = "";
            let longestEnd = "";

            let run = 0;
            let runStart = "";

            for (const day of days) {
              if (day.contributionCount > 0) {
                if (!run) {
                  runStart = day.date;
                }

                run++;

                if (run > longest) {
                  longest = run;
                  longestStart = runStart;
                  longestEnd = day.date;
                }
              } else {
                run = 0;
                runStart = "";
              }
            }

            /*
             * ------------------------------------------------------------
             * Current streak
             * ------------------------------------------------------------
             *
             * If today has no contribution, start from yesterday.
             * Otherwise include today.
             */

            let current = 0;
            let currentStart = "";
            let currentEnd = "";

            let i = days.length - 1;

            if (
              i >= 0 &&
              days[i].date === today &&
              days[i].contributionCount === 0
            ) {
              i--;
            }

            for (
              ;
              i >= 0 && days[i].contributionCount > 0;
              i--
            ) {
              current++;

              currentEnd ||= days[i].date;

              currentStart = days[i].date;
            }

            console.log(`Current streak: ${current}`);
            console.log(`Longest streak: ${longest}`);

            /*
             * ------------------------------------------------------------
             * SVG escaping
             * ------------------------------------------------------------
             */

            const esc = value =>
              String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");

            /*
             * ------------------------------------------------------------
             * Date formatting
             * ------------------------------------------------------------
             */

            const date = value =>
              value
                ? new Date(`${value}T00:00:00Z`).toLocaleDateString(
                    "en-US",
                    {
                      month: "short",
                      day: "numeric",
                      year: "numeric",
                      timeZone: "UTC"
                    }
                  )
                : "—";

            /*
             * ============================================================
             * CONTRIBUTION CALENDAR SVG
             * ============================================================
             */

            const cell = 15;
            const size = 12;
            const left = 42;
            const top = 58;

            const width =
              left + weeks.length * cell + 12;

            const height = 205;

            const colors = {
              NONE: "#161B22",
              FIRST_QUARTILE: "#0E4429",
              SECOND_QUARTILE: "#006D32",
              THIRD_QUARTILE: "#26A641",
              FOURTH_QUARTILE: "#39D353"
            };

            const months = [
              "Jan",
              "Feb",
              "Mar",
              "Apr",
              "May",
              "Jun",
              "Jul",
              "Aug",
              "Sep",
              "Oct",
              "Nov",
              "Dec"
            ];

            let calendarSvg = `
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="${width}"
                height="${height}"
                viewBox="0 0 ${width} ${height}"
                role="img"
                aria-label="${esc(total)} contributions in the last year"
              >

                <rect
                  width="100%"
                  height="100%"
                  rx="10"
                  fill="#0D1117"
                  stroke="#30363D"
                />

                <text
                  x="18"
                  y="24"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="14"
                  font-weight="600"
                >
                  ${total} contributions in the last year
                </text>
            `;

            /*
             * Month labels
             */

            let lastMonth = "";

            weeks.forEach((week, wi) => {
              const first = week.contributionDays[0];

              if (!first) {
                return;
              }

              const month =
                months[
                  new Date(
                    `${first.date}T00:00:00Z`
                  ).getUTCMonth()
                ];

              if (month !== lastMonth) {
                calendarSvg += `
                  <text
                    x="${left + wi * cell}"
                    y="46"
                    fill="#8B949E"
                    font-family="Arial"
                    font-size="10"
                  >
                    ${month}
                  </text>
                `;

                lastMonth = month;
              }
            });

            /*
             * Weekday labels
             */

            [
              ["Mon", 1],
              ["Wed", 3],
              ["Fri", 5]
            ].forEach(([label, row]) => {
              calendarSvg += `
                <text
                  x="10"
                  y="${top + row * cell + 10}"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="10"
                >
                  ${label}
                </text>
              `;
            });

            /*
             * Contribution cells
             */

            weeks.forEach((week, wi) => {
              week.contributionDays.forEach(day => {
                const row =
                  new Date(
                    `${day.date}T00:00:00Z`
                  ).getUTCDay();

                calendarSvg += `
                  <rect
                    x="${left + wi * cell}"
                    y="${top + row * cell}"
                    width="${size}"
                    height="${size}"
                    rx="2"
                    fill="${
                      colors[day.contributionLevel] ||
                      colors.NONE
                    }"
                  >
                    <title>
                      ${day.contributionCount}
                      contribution${
                        day.contributionCount === 1
                          ? ""
                          : "s"
                      }
                      on ${esc(day.date)}
                    </title>
                  </rect>
                `;
              });
            });

            /*
             * Legend
             */

            const legend = [
              "#161B22",
              "#0E4429",
              "#006D32",
              "#26A641",
              "#39D353"
            ];

            calendarSvg += `
              <text
                x="${left}"
                y="190"
                fill="#8B949E"
                font-family="Arial"
                font-size="10"
              >
                Less
              </text>
            `;

            legend.forEach((color, index) => {
              calendarSvg += `
                <rect
                  x="${left + 28 + index * 15}"
                  y="181"
                  width="11"
                  height="11"
                  rx="2"
                  fill="${color}"
                />
              `;
            });

            calendarSvg += `
              <text
                x="${left + 105}"
                y="190"
                fill="#8B949E"
                font-family="Arial"
                font-size="10"
              >
                More
              </text>

              </svg>
            `;

            /*
             * ============================================================
             * GITHUB STATISTICS SVG
             * ============================================================
             */

            const statsSvg = `
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="820"
                height="210"
                viewBox="0 0 820 210"
                role="img"
                aria-label="GitHub statistics for ${esc(username)}"
              >

                <rect
                  width="100%"
                  height="100%"
                  rx="12"
                  fill="#0D1117"
                  stroke="#30363D"
                />

                <text
                  x="28"
                  y="35"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="16"
                  font-weight="600"
                >
                  GitHub Stats
                </text>

                <text
                  x="115"
                  y="85"
                  text-anchor="middle"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="26"
                  font-weight="700"
                >
                  ${total}
                </text>

                <text
                  x="115"
                  y="108"
                  text-anchor="middle"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="11"
                >
                  Total Contributions
                </text>

                <text
                  x="410"
                  y="85"
                  text-anchor="middle"
                  fill="#C9A76A"
                  font-family="Arial"
                  font-size="26"
                  font-weight="700"
                >
                  ${current}
                </text>

                <text
                  x="410"
                  y="108"
                  text-anchor="middle"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="11"
                >
                  Current Streak
                </text>

                <text
                  x="705"
                  y="85"
                  text-anchor="middle"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="26"
                  font-weight="700"
                >
                  ${longest}
                </text>

                <text
                  x="705"
                  y="108"
                  text-anchor="middle"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="11"
                >
                  Longest Streak
                </text>

                <line
                  x1="273"
                  y1="58"
                  x2="273"
                  y2="125"
                  stroke="#30363D"
                />

                <line
                  x1="547"
                  y1="58"
                  x2="547"
                  y2="125"
                  stroke="#30363D"
                />

                <text
                  x="90"
                  y="155"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="15"
                  font-weight="600"
                >
                  ${commits}
                </text>

                <text
                  x="90"
                  y="175"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="10"
                >
                  Commits
                </text>

                <text
                  x="280"
                  y="155"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="15"
                  font-weight="600"
                >
                  ${pullRequests}
                </text>

                <text
                  x="280"
                  y="175"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="10"
                >
                  Pull Requests
                </text>

                <text
                  x="490"
                  y="155"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="15"
                  font-weight="600"
                >
                  ${issues}
                </text>

                <text
                  x="490"
                  y="175"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="10"
                >
                  Issues
                </text>

                <text
                  x="690"
                  y="155"
                  fill="#E6EDF3"
                  font-family="Arial"
                  font-size="15"
                  font-weight="600"
                >
                  ${repositories}
                </text>

                <text
                  x="690"
                  y="175"
                  fill="#8B949E"
                  font-family="Arial"
                  font-size="10"
                >
                  Repositories
                </text>

                <text
                  x="410"
                  y="198"
                  text-anchor="middle"
                  fill="#6B6D74"
                  font-family="Arial"
                  font-size="9"
                >
                  ${
                    current
                      ? `${date(currentStart)} – ${date(currentEnd)}`
                      : "No current streak"
                  }
                </text>

              </svg>
            `;

            /*
             * ============================================================
             * WRITE FILES
             * ============================================================
             */

            fs.mkdirSync("assets", {
              recursive: true
            });

            fs.writeFileSync(
              "assets/contribution-calendar.svg",
              calendarSvg
            );

            fs.writeFileSync(
              "assets/github-stats.svg",
              statsSvg
            );

            /*
             * ============================================================
             * FINAL LOG
             * ============================================================
             */

            console.log("");
            console.log("========== FINAL RESULTS ==========");

            console.log(
              `Total contributions: ${total}`
            );

            console.log(
              `Current streak: ${current}`
            );

            console.log(
              `Longest streak: ${longest}`
            );

            console.log(
              `Commits: ${commits}`
            );

            console.log(
              `Pull requests: ${pullRequests}`
            );

            console.log(
              `Issues: ${issues}`
            );

            console.log(
              `Repositories: ${repositories}`
            );

            console.log(
              `Restricted contributions: ${c.restrictedContributionsCount}`
            );

            console.log(
              `Has restricted contributions: ${c.hasAnyRestrictedContributions}`
            );

            console.log(
              `Latest restricted contribution: ${
                c.latestRestrictedContributionDate || "none"
              }`
            );

            console.log(
              `Earliest restricted contribution: ${
                c.earliestRestrictedContributionDate || "none"
              }`
            );

            console.log("====================================");

      - name: Commit generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-calendar.svg assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub activity"
            git push
          fi