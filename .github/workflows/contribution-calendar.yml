name: Update GitHub Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub graphics
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PROFILE_TOKEN }}
          script: |
            const fs = require("fs");
            const username = "Viyan-Dabre";

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalRepositoriesWithContributedCommits
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                          date
                          contributionLevel
                        }
                      }
                    }
                  }
                }
              }
            `;

            const { user } = await github.graphql(query, { login: username });
            const c = user.contributionsCollection;
            const calendar = c.contributionCalendar;
            const weeks = calendar.weeks;

            const days = weeks
              .flatMap(w => w.contributionDays)
              .sort((a, b) => a.date.localeCompare(b.date));

            const total = calendar.totalContributions;
            const commits = c.totalCommitContributions;
            const pullRequests = c.totalPullRequestContributions;
            const issues = c.totalIssueContributions;
            const repositories = c.totalRepositoriesWithContributedCommits;

            // Longest streak
            let longest = 0, longestStart = "", longestEnd = "";
            let run = 0, runStart = "";

            for (const day of days) {
              if (day.contributionCount > 0) {
                if (!run) runStart = day.date;
                run++;

                if (run > longest) {
                  longest = run;
                  longestStart = runStart;
                  longestEnd = day.date;
                }
              } else {
                run = 0;
                runStart = "";
              }
            }

            // Current streak
            let current = 0, currentStart = "", currentEnd = "";
            let i = days.length - 1;

            const today = new Date().toISOString().slice(0, 10);

            if (
              i >= 0 &&
              days[i].date === today &&
              days[i].contributionCount === 0
            ) {
              i--;
            }

            for (; i >= 0 && days[i].contributionCount > 0; i--) {
              current++;
              currentEnd ||= days[i].date;
              currentStart = days[i].date;
            }

            const esc = value =>
              String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");

            const date = value =>
              value
                ? new Date(`${value}T00:00:00Z`).toLocaleDateString(
                    "en-US",
                    {
                      month: "short",
                      day: "numeric",
                      year: "numeric",
                      timeZone: "UTC"
                    }
                  )
                : "—";

            /*
             * Contribution calendar
             */
            const cell = 15;
            const size = 12;
            const left = 42;
            const top = 58;
            const width = left + weeks.length * cell + 12;
            const height = 205;

            const colors = {
              NONE: "#161B22",
              FIRST_QUARTILE: "#0E4429",
              SECOND_QUARTILE: "#006D32",
              THIRD_QUARTILE: "#26A641",
              FOURTH_QUARTILE: "#39D353"
            };

            const months = [
              "Jan", "Feb", "Mar", "Apr", "May", "Jun",
              "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
            ];

            let calendarSvg = `
              <svg xmlns="http://www.w3.org/2000/svg"
                   width="${width}" height="${height}"
                   viewBox="0 0 ${width} ${height}"
                   role="img"
                   aria-label="${esc(total)} contributions in the last year">

                <rect width="100%" height="100%" rx="10"
                      fill="#0D1117" stroke="#30363D"/>

                <text x="18" y="24"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="14"
                      font-weight="600">
                  ${total} contributions in the last year
                </text>
            `;

            let lastMonth = "";

            weeks.forEach((week, wi) => {
              const first = week.contributionDays[0];
              if (!first) return;

              const month =
                months[new Date(`${first.date}T00:00:00Z`).getUTCMonth()];

              if (month !== lastMonth) {
                calendarSvg += `
                  <text x="${left + wi * cell}" y="46"
                        fill="#8B949E"
                        font-family="Arial"
                        font-size="10">
                    ${month}
                  </text>`;
                lastMonth = month;
              }
            });

            [["Mon", 1], ["Wed", 3], ["Fri", 5]].forEach(([label, row]) => {
              calendarSvg += `
                <text x="10" y="${top + row * cell + 10}"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="10">
                  ${label}
                </text>`;
            });

            weeks.forEach((week, wi) => {
              week.contributionDays.forEach(day => {
                const row =
                  new Date(`${day.date}T00:00:00Z`).getUTCDay();

                calendarSvg += `
                  <rect x="${left + wi * cell}"
                        y="${top + row * cell}"
                        width="${size}"
                        height="${size}"
                        rx="2"
                        fill="${colors[day.contributionLevel] || colors.NONE}">
                    <title>
                      ${day.contributionCount} contribution${day.contributionCount === 1 ? "" : "s"} on ${esc(day.date)}
                    </title>
                  </rect>`;
              });
            });

            const legend = [
              "#161B22",
              "#0E4429",
              "#006D32",
              "#26A641",
              "#39D353"
            ];

            calendarSvg += `
              <text x="${left}" y="190"
                    fill="#8B949E"
                    font-family="Arial"
                    font-size="10">
                Less
              </text>
            `;

            legend.forEach((color, i) => {
              calendarSvg += `
                <rect x="${left + 28 + i * 15}"
                      y="181"
                      width="11"
                      height="11"
                      rx="2"
                      fill="${color}"/>`;
            });

            calendarSvg += `
              <text x="${left + 105}" y="190"
                    fill="#8B949E"
                    font-family="Arial"
                    font-size="10">
                More
              </text>
              </svg>
            `;

            /*
             * GitHub statistics card
             *
             * IMPORTANT:
             * profile-card.svg is NOT touched.
             */
            const statsSvg = `
              <svg xmlns="http://www.w3.org/2000/svg"
                   width="820" height="210"
                   viewBox="0 0 820 210"
                   role="img"
                   aria-label="GitHub statistics for ${esc(username)}">

                <rect width="100%" height="100%" rx="12"
                      fill="#0D1117" stroke="#30363D"/>

                <text x="28" y="35"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="16"
                      font-weight="600">
                  GitHub Stats
                </text>

                <text x="115" y="85"
                      text-anchor="middle"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="26"
                      font-weight="700">
                  ${total}
                </text>

                <text x="115" y="108"
                      text-anchor="middle"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="11">
                  Total Contributions
                </text>

                <text x="410" y="85"
                      text-anchor="middle"
                      fill="#C9A76A"
                      font-family="Arial"
                      font-size="26"
                      font-weight="700">
                  ${current}
                </text>

                <text x="410" y="108"
                      text-anchor="middle"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="11">
                  Current Streak
                </text>

                <text x="705" y="85"
                      text-anchor="middle"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="26"
                      font-weight="700">
                  ${longest}
                </text>

                <text x="705" y="108"
                      text-anchor="middle"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="11">
                  Longest Streak
                </text>

                <line x1="273" y1="58" x2="273" y2="125"
                      stroke="#30363D"/>
                <line x1="547" y1="58" x2="547" y2="125"
                      stroke="#30363D"/>

                <text x="90" y="155"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="15"
                      font-weight="600">
                  ${commits}
                </text>
                <text x="90" y="175"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="10">
                  Commits
                </text>

                <text x="280" y="155"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="15"
                      font-weight="600">
                  ${pullRequests}
                </text>
                <text x="280" y="175"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="10">
                  Pull Requests
                </text>

                <text x="490" y="155"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="15"
                      font-weight="600">
                  ${issues}
                </text>
                <text x="490" y="175"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="10">
                  Issues
                </text>

                <text x="690" y="155"
                      fill="#E6EDF3"
                      font-family="Arial"
                      font-size="15"
                      font-weight="600">
                  ${repositories}
                </text>
                <text x="690" y="175"
                      fill="#8B949E"
                      font-family="Arial"
                      font-size="10">
                  Repositories
                </text>

                <text x="410" y="198"
                      text-anchor="middle"
                      fill="#6B6D74"
                      font-family="Arial"
                      font-size="9">
                  ${current ? `${date(currentStart)} – ${date(currentEnd)}` : "No current streak"}
                </text>
              </svg>
            `;

            fs.mkdirSync("assets", { recursive: true });

            fs.writeFileSync(
              "assets/contribution-calendar.svg",
              calendarSvg
            );

            fs.writeFileSync(
              "assets/github-stats.svg",
              statsSvg
            );

            console.log(`Total contributions: ${total}`);
            console.log(`Current streak: ${current}`);
            console.log(`Longest streak: ${longest}`);
            console.log(`Commits: ${commits}`);
            console.log(`Pull requests: ${pullRequests}`);
            console.log(`Issues: ${issues}`);
            console.log(`Repositories: ${repositories}`);

      - name: Commit generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-calendar.svg assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub activity"
            git push
          fi