<svg viewBox="0 0 480 256" xmlns="http://www.w3.org/2000/svg" width="480" height="256">
  <defs>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A76A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5C8A8C" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="479" height="255" rx="10" fill="#111217" stroke="url(#cardBorder)" stroke-width="1"/>

  <!-- header bar -->
  <text x="40" y="34" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#C9A76A" letter-spacing="3" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.5s" fill="freeze"/>
    PROFILE
  </text>
  <text x="440" y="34" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#6B6D74" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.5s" fill="freeze"/>
    ~/viyan-dabre
  </text>
  <line x1="24" y1="48" x2="456" y2="48" stroke="#2A2C34" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/>
  </line>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.00s" dur="0.4s" fill="freeze"/>
    <text x="40" y="66" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6B6D74" letter-spacing="1">NAME</text>
    <text x="180" y="66" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#E8E6E1">Viyan Dabre</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.22s" dur="0.4s" fill="freeze"/>
    <text x="40" y="92" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6B6D74" letter-spacing="1">ROLE</text>
    <text x="180" y="92" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#E8E6E1">IT Undergrad (B.E, 2027)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.44s" dur="0.4s" fill="freeze"/>
    <text x="40" y="118" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6B6D74" letter-spacing="1">FOCUS</text>
    <text x="180" y="118" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#E8E6E1">Full-Stack Dev / AI Automation</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.66s" dur="0.4s" fill="freeze"/>
    <text x="40" y="144" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6B6D74" letter-spacing="1">BUILDING</text>
    <text x="180" y="144" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#E8E6E1">AI Agent Automation System</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.88s" dur="0.4s" fill="freeze"/>
    <text x="40" y="170" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6B6D74" letter-spacing="1">STACK</text>
    <text x="180" y="170" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#E8E6E1">Java . Python . React . Node</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="2.10s" dur="0.4s" fill="freeze"/>
    <text x="40" y="196" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6B6D74" letter-spacing="1">BASE</text>
    <text x="180" y="196" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#E8E6E1">Mumbai, India</text>
  </g>

  <!-- footer status -->
  <circle cx="40" cy="236" r="3" fill="#5C8A8C" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="2.52s" dur="0.4s" fill="freeze"/>
  </circle>
  <text x="52" y="240" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#6B6D74" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="2.52s" dur="0.4s" fill="freeze"/>
    open to internship opportunities
  </text>
</svg>